[package]
name = "dialogrs"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Speaker-attributed transcription: scriptrs for what was said, speakrs for who said it"
license = "Apache-2.0"
repository = "https://github.com/avencera/dialogrs"
# path dependencies until cudakit, speakrs and scriptrs publish their CUDA backends
publish = false

[features]
default = []
cuda = ["scriptrs/cuda", "speakrs/cuda"]

[dependencies]
scriptrs = { path = "../scriptrs", default-features = false, features = ["long-form"] }
speakrs = { path = "../speakrs" }
thiserror = "2"

[dev-dependencies]
eyre = "0.6"
hound = "3.5"
serde_json = "1"

# native scriptrs bundles and precisions exist only in CUDA builds
[[example]]
name = "bench"
required-features = ["cuda"]
