[package]
name = "dialogrs-python"
# keep equal to the dialogrs version; the release workflow checks the wheel names
# against the tag
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/avencera/dialogrs"
authors = ["Praveen Perera"]
description = "Python bindings for dialogrs"
publish = false

# standalone, so the root stays a single-package manifest
[workspace]

[lib]
name = "dialogrs_native"
crate-type = ["cdylib"]
# the extension is tested through pytest; a Rust test harness would have to link libpython
test = false
doctest = false

# scriptrs and speakrs are the sibling checkouts dialogrs itself builds against.
# speakrs-sdk is speakrs's binding layer, used here for audio decoding and mode names;
# its cpu feature gives every build a diarization backend, so the crate compiles on
# platforms where scriptrs has none and loading a model reports the platform instead
[dependencies]
dialogrs = { path = "../.." }
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }
scriptrs = { path = "../../../scriptrs", default-features = false, features = ["online", "long-form"] }
speakrs-sdk = { path = "../../../speakrs/crates/speakrs-sdk", default-features = false, features = ["online", "cpu"] }

# one wheel per platform carries the backends that platform runs: Core ML on macOS,
# and CUDA on Linux and Windows x86_64, which is loaded at run time, so those wheels
# build without a GPU or CUDA toolkit
[target.'cfg(target_os = "macos")'.dependencies]
speakrs-sdk = { path = "../../../speakrs/crates/speakrs-sdk", default-features = false, features = ["online", "cpu", "coreml"] }

[target.'cfg(all(any(target_os = "linux", target_os = "windows"), target_arch = "x86_64"))'.dependencies]
dialogrs = { path = "../..", features = ["cuda"] }
# speakrs-sdk lists the CUDA modes only with its own cuda feature
speakrs-sdk = { path = "../../../speakrs/crates/speakrs-sdk", default-features = false, features = ["online", "cpu", "cuda"] }
